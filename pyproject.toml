[project]
name = "causal-ai"
version = "0.1.0"
description = "CLI-based causal inference agent built on DeepAgents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "causal-learn>=0.1.4.4",
    "chromadb>=1.5.0",
    "deepagents @ git+https://github.com/zzzrbx/deepagents.git@fix/pregel-send-serialization-in-subagent-state#subdirectory=libs/deepagents",
    "dowhy>=0.14",
    "econml>=0.16.0",
    "langchain-anthropic>=1.3.3",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.1.9",
    "langgraph",
    "numpy>=2.3.5",
    "pandas>=3.0.0",
    "prompt-toolkit>=3.0.52",
    "pylint",
    "python-dotenv",
    "rich",
    "scikit-learn>=1.6.1",
]

[project.scripts]
causal-ai = "causal_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/causal_ai"]

[tool.pylint.messages_control]
disable = [
    "too-many-locals",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
